<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B7CFF"/>
      <stop offset="0.55" stop-color="#3F4FE0"/>
      <stop offset="1" stop-color="#2A2B8F"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF0FA"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0B0F4A" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824pt body inset 100pt -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>
  <!-- The page -->
  <rect x="292" y="226" width="440" height="572" rx="58" fill="url(#page)" filter="url(#shadow)"/>
  <!-- Heading -->
  <rect x="368" y="330" width="206" height="46" rx="23" fill="#2A2B8F"/>
  <!-- Body lines -->
  <rect x="368" y="428" width="288" height="30" rx="15" fill="#C5CAEC"/>
  <rect x="414" y="496" width="176" height="30" rx="15" fill="#C5CAEC"/>
  <rect x="414" y="564" width="232" height="30" rx="15" fill="#C5CAEC"/>
  <rect x="368" y="632" width="172" height="30" rx="15" fill="#C5CAEC"/>
  <!-- The cursor -->
  <rect x="610" y="472" width="26" height="78" rx="10" fill="#FF9F0A"/>
</svg>
