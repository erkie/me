name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux (build + test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig1-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libvulkan1 libzstd-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  macos:
    name: macOS (test + Editor.app)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: script/bundle-macos
      - name: Zip Editor.app
        run: ditto -c -k --keepParent dist/Editor.app dist/Editor-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Editor-macos
          path: dist/Editor-macos.zip
