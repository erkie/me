name: CI

# Pushes to master and pull requests; other branches only through a pull
# request, so the same commit isn't built twice.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every push to master gets its release; elsewhere only the newest run
  # matters.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux (test + tarball)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the build number is the commit count.
          fetch-depth: 0
      - name: Install GPUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig1-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libvulkan1 libzstd-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      # The publish job attaches it to the release.
      - run: script/package-linux
      - uses: actions/upload-artifact@v4
        with:
          name: Me-linux-x86_64
          retention-days: 7
          path: dist/Me-linux-x86_64.tar.gz

  windows:
    name: Windows (test + zip)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every crate's failures at once: most tests are written on Unix.
      - run: cargo test --workspace --locked --no-fail-fast
      - run: script/package-windows
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: Me-windows-x86_64
          retention-days: 7
          path: dist/Me-windows-x86_64.zip

  # The macOS 26 app icon (light, dark, clear and tinted). Xcode 26 only
  # compiles Icon Composer files on macOS 26, so it's done here and the Mac
  # builds below put it in the app.
  app-icon:
    name: App icon (macOS 26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: script/compile-app-icon dist/app-icon
      - uses: actions/upload-artifact@v4
        with:
          name: app-icon
          retention-days: 1
          path: dist/app-icon/Assets.car

  macos:
    name: macOS (test + Me.app)
    needs: app-icon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - uses: actions/download-artifact@v4
        with:
          name: app-icon
          path: dist/app-icon
      # Checks that the app still bundles; the release job publishes it.
      - run: script/bundle-macos
        env:
          ME_APP_ICON_CAR: dist/app-icon/Assets.car
      - run: test -s dist/Me.app/Contents/Resources/Assets.car

  # Every push to master that passes the tests becomes a build: a universal
  # Me.app, built here, and the Linux and Windows builds from their jobs,
  # published together as the GitHub release build-<n> (n = commit count).
  # The Mac app updates itself from these releases.
  release:
    name: Release (Me.app, universal)
    needs: [linux, macos, app-icon]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: macos-15
    outputs:
      build: ${{ steps.package.outputs.build }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the build number is the commit count, and the
          # notes list the commits since the last build's tag.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          name: app-icon
          path: dist/app-icon
      - run: script/bundle-macos --universal
        env:
          ME_APP_ICON_CAR: dist/app-icon/Assets.car
      - run: test -s dist/Me.app/Contents/Resources/Assets.car
      - name: Package
        id: package
        run: |
          build=$(git rev-list --count HEAD)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ditto -c -k --keepParent dist/Me.app dist/Me-macos.zip
          shasum -a 256 dist/Me-macos.zip | cut -d' ' -f1 > dist/Me-macos.zip.sha256
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: Me-macos-build-${{ steps.package.outputs.build }}
          retention-days: 7
          path: |
            dist/Me-macos.zip
            dist/Me-macos.zip.sha256

  # No signing keys here. With the repository variable SIGNED_RELEASES set
  # to true, the release is a draft: a Mac outside GitHub signs, notarizes
  # and publishes it (script/sign-release, docs/SIGNING.md). The Linux and
  # Windows builds aren't signed.
  publish:
    name: Publish release
    needs: [release, linux, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The notes list the commits since the last build's tag.
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: Me-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.release.outputs.build }}
          VERSION: ${{ needs.release.outputs.version }}
          SIGNED_RELEASES: ${{ vars.SIGNED_RELEASES }}
        run: |
          previous=$(git describe --tags --match 'build-*' --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "Me $VERSION, build $BUILD ($(git rev-parse --short HEAD))"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --format='- %s' "$previous..HEAD"
            else
              git log --no-merges --format='- %s' -20
            fi
          } > notes.md
          # A draft gets its tag when it's published, so the notes of the
          # next draft still start from the last published build.
          if [ "$SIGNED_RELEASES" = true ]; then publish=--draft; else publish=--latest; fi
          # A re-run replaces its own release.
          gh release delete "build-$BUILD" --cleanup-tag --yes 2>/dev/null || true
          gh release create "build-$BUILD" dist/Me-macos.zip dist/Me-macos.zip.sha256 \
            dist/Me-linux-x86_64.tar.gz dist/Me-windows-x86_64.zip \
            --target "$GITHUB_SHA" --title "Me $VERSION (build $BUILD)" \
            --notes-file notes.md "$publish"
          # Keep the newest 20 builds.
          gh release list --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[20:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
