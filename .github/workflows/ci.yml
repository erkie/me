name: CI

# Pushes to master and pull requests; other branches only through a pull
# request, so the same commit isn't built twice.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Every push to master gets its release; elsewhere only the newest run
  # matters.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Linux (build + test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig1-dev libfreetype-dev libx11-xcb-dev libxcb1-dev libvulkan1 libzstd-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  macos:
    name: macOS (test + Me.app)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      # Checks that the app still bundles; the release job publishes it.
      - run: script/bundle-macos

  # Every push to master that passes the tests becomes a build: a universal
  # Me.app uploaded as an artifact and published as the GitHub release
  # build-<n> (n = commit count), which the app updates itself from.
  release:
    name: Release (Me.app, universal)
    needs: [linux, macos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the build number is the commit count, and the
          # notes list the commits since the last build's tag.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: script/bundle-macos --universal
      - name: Package
        id: package
        run: |
          build=$(git rev-list --count HEAD)
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ditto -c -k --keepParent dist/Me.app dist/Me-macos.zip
          shasum -a 256 dist/Me-macos.zip | cut -d' ' -f1 > dist/Me-macos.zip.sha256
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The release keeps the build; the artifact is a short-lived copy, and
      # a full artifact storage quota mustn't stop the release.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Me-macos-build-${{ steps.package.outputs.build }}
          retention-days: 7
          path: |
            dist/Me-macos.zip
            dist/Me-macos.zip.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ steps.package.outputs.build }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          previous=$(git describe --tags --match 'build-*' --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "Me $VERSION, build $BUILD ($(git rev-parse --short HEAD))"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --format='- %s' "$previous..HEAD"
            else
              git log --no-merges --format='- %s' -20
            fi
          } > notes.md
          # A re-run replaces its own release.
          gh release delete "build-$BUILD" --cleanup-tag --yes 2>/dev/null || true
          gh release create "build-$BUILD" dist/Me-macos.zip dist/Me-macos.zip.sha256 \
            --target "$GITHUB_SHA" --title "Me $VERSION (build $BUILD)" \
            --notes-file notes.md --latest
          # Keep the newest 20 builds.
          gh release list --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[20:] | .[].tagName' |
            while read -r tag; do gh release delete "$tag" --cleanup-tag --yes; done
