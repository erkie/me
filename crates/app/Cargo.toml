[package]
name = "me-app"
description = "Me's GUI: GPUI windows, file tree, tabs, editor, markdown preview, finder and search."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false
default-run = "me-app"

[[bin]]
name = "me-app"
path = "src/main.rs"

[dependencies]
me-ipc.workspace = true
me-lsp.workspace = true
me-project.workspace = true
me-syntax.workspace = true
me-text.workspace = true

gpui.workspace = true
gpui_platform.workspace = true
gpui-component = { workspace = true, features = [
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-lua",
    "tree-sitter-markdown-inline",
    "tree-sitter-python",
    "tree-sitter-ruby",
    "tree-sitter-rust",
    "tree-sitter-swift",
    "tree-sitter-toml",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
gpui-kit-assets = "=0.8.0"
gpui-base.workspace = true
merman.workspace = true

anyhow.workspace = true
parking_lot.workspace = true
tempfile.workspace = true
sha2 = "0.10"
futures = "0.3"
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
nucleo.workspace = true
ignore.workspace = true
trash = "5"
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
