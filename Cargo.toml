[workspace]
resolver = "2"
members = ["crates/text", "crates/project", "crates/ipc", "crates/cli"]
default-members = ["crates/text", "crates/project", "crates/ipc", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/erkie/editor"
rust-version = "1.90"

[workspace.dependencies]
editor-text = { path = "crates/text" }
editor-syntax = { path = "crates/syntax" }
editor-project = { path = "crates/project" }
editor-ipc = { path = "crates/ipc" }

# UI. Pinned exactly: GPUI is pre-1.0 and changes between snapshots.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "x11", "wayland"] }
gpui-component = { version = "=0.8.0", default-features = false }

anyhow = "1"
crossbeam-channel = "0.5"
dirs = "6"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
log = "0.4"
nucleo = "0.5"
parking_lot = "0.12"
regex = "1"
regex-cursor = { version = "0.1", default-features = false, features = ["ropey"] }
ropey = { version = "1.6", default-features = false, features = ["simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
tempfile = "3"
unicode-segmentation = "1.12"
unicode-width = "0.2"

tree-sitter = "0.26"
tree-sitter-language = "0.1"

[profile.dev]
# Keep debug builds snappy enough to use: optimize dependencies.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
